    <style>:root {
--bg-main: #090a0f;
--text-primary: #ffffff;
--text-secondary: rgba(255, 255, 255, 0.65);
--text-tertiary: rgba(255, 255, 255, 0.4);
--glass-base: rgba(255, 255, 255, 0.05);
--glass-hover: rgba(255, 255, 255, 0.09);
--glass-active: rgba(255, 255, 255, 0.15);

--sab: env(safe-area-inset-bottom, 0px);
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
-webkit-tap-highlight-color: transparent;
-webkit-user-select: none;
user-select: none;
touch-action: manipulation;
}
input, textarea {
-webkit-user-select: text;
user-select: text;
}
body {
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Roboto, sans-serif;
background-color: var(--bg-main);
color: var(--text-primary);
min-height: 100vh;
min-height: var(--tg-viewport-height, 100vh);
padding: calc(24px + var(--sat)) 16px calc(80px + var(--sab)) 16px;

}
.ambient-background {
position: fixed;
top: 0;
right: 0;
bottom: 0;
left: 0;
z-index: -1;
overflow: hidden;
background: radial-gradient(circle at 50% 10%, #161922 0%, #090a0f 80%);
pointer-events: none;
transform: translate3d(0, 0, 0);
}
.stgau-watermark {
position: absolute;
top: 50%;
left: 50%;
transform: translate3d(-50%, -50%, 0);
width: 380px;
height: 380px;
background: url('watermark.png') no-repeat center center;
background-size: contain;
opacity: 0.06;
pointer-events: none;
}
.bubble {
position: absolute;
border-radius: 50%;
filter: blur(40px);
opacity: 0.22;
will-change: transform;
backface-visibility: hidden;
transition: opacity 0.5s ease;
}
.bubble-1 { width: 280px; height: 280px; background: #ffffff; top: 5%; left: -10%; animation: floatChaotic1 24s infinite ease-in-out; }
.bubble-2 { width: 340px; height: 340px; background: #8e8e93; bottom: -5%; right: -15%; animation: floatChaotic2 30s infinite ease-in-out; }
.bubble-3 { width: 220px; height: 220px; background: #aeaeb2; top: 40%; left: 30%; animation: floatChaotic3 22s infinite ease-in-out; }
@keyframes floatChaotic1 {
0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
50% { transform: translate3d(-40px, 140px, 0) scale(0.9) rotate(90deg); }
100% { transform: translate3d(0, 0, 0) scale(1) rotate(180deg); }
}
@keyframes floatChaotic2 {
0% { transform: translate3d(0, 0, 0); }
50% { transform: translate3d(-30px, -150px, 0) scale(0.85); }
100% { transform: translate3d(0, 0, 0); }
}
@keyframes floatChaotic3 {
0% { transform: translate3d(0, 0, 0) scale(0.9); }
50% { transform: translate3d(-70px, 90px, 0) scale(1.2); }
100% { transform: translate3d(0, 0, 0) scale(0.9); }
}
.header {

}

.search-wrapper {

animation: openElement 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
}
.search-box {

.close-btn {

.search-wrapper.fullscreen .search-box {

.search-wrapper.fullscreen .close-btn {

.suggestions-overlay {
position: absolute;
top: 62px;
left: 0;
width: 100%;
max-height: calc(100vh - 200px);
max-height: calc(var(--tg-viewport-stable-height, 100vh) - 200px);

-webkit-overflow-scrolling: touch;

pointer-events: none;

transform-origin: top center;
transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1), 
opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1);
}
.search-wrapper.fullscreen .suggestions-overlay {
opacity: 1;
pointer-events: auto;
transform: scaleY(1) scaleX(1) translate3d(0,0,0);
}
.grid-container { 
display: grid; 
grid-template-columns: repeat(2, 1fr); 
gap: 12px; 
margin-bottom: 20px; 
opacity: 0;
animation: openElement 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
}
.glass-card {
background: var(--glass-base);

-webkit-backdrop-filter: blur(16px);
border: 1px solid var(--glass-border);
border-radius: 22px;

text-align: left;
cursor: pointer;
box-shadow: var(--glass-shadow);

.glass-card p { font-size: 12px; color: var(--text-secondary); }
.grid-container.units { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 10px; }
.grid-container.units .glass-card { padding: 14px 12px; border-radius: 18px; }
.grid-container.units .glass-card h3 { font-size: 16px; letter-spacing: -0.01em; }

.glass-card.is-active { border-color: var(--glass-border-glow); background: var(--glass-hover); }
.unit-title { font-size: 17px; font-weight: 700; margin-bottom: 2px; color: #fff; }
.unit-sub { font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.4; }
.floor-group { margin-bottom: 16px; }
.floor-group:last-child { margin-bottom: 0; }
.floor-title {

}
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.room-chip {

background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.1);

font-weight: 500;
cursor: pointer;
transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;

.room-chip:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.35); }
.search-note { font-size: 12px; color: var(--text-tertiary); text-align: center; padding: 8px 0 2px; }
.content-layout {
display: flex;
gap: 12px;
position: relative;
overflow: hidden;
opacity: 0;
animation: openElement 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
}
.content-display {
flex: 1;
background: var(--glass-base);
backdrop-filter: blur(18px);
-webkit-backdrop-filter: blur(18px);
border: 1px solid var(--glass-border);
border-radius: 24px;
padding: 20px;
box-shadow: var(--glass-shadow);

}
.info-route-panel {

opacity: 0;
overflow: hidden;

}
.room-card {
background: rgba(255, 255, 255, 0.04);
border: 1px solid rgba(255, 255, 255, 0.08);
border-radius: 18px;
padding: 14px;
margin-bottom: 10px;
cursor: pointer;
transition: transform 0.25s ease, background 0.25s ease;
}
.room-card:active { transform: scale(0.98) translate3d(0,0,0); background: rgba(255, 255, 255, 0.1); }
.room-info h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: #fff; }
.room-info .room-loc { font-size: 12px; color: #a1a1aa; margin-bottom: 2px; }
.room-info .room-desc { font-size: 11px; color: var(--text-secondary); }
.optimize-btn {
position: fixed;
bottom: max(16px, env(safe-area-inset-bottom, 16px));
left: 16px;
z-index: 1000;
background: var(--glass-base);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border: 1px solid var(--glass-border);
border-radius: 14px;
padding: 10px 14px;
color: var(--text-primary);
font-size: 12px;
font-weight: 500;
box-shadow: var(--glass-shadow);
cursor: pointer;
transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.3s ease, border-color 0.3s ease;
}
.optimize-btn:active {
transform: scale(0.92) translate3d(0,0,0);
background: var(--glass-active);
border-color: #fff;
}
@keyframes openHeader {
from { opacity: 0; transform: translate3d(0, -20px, 0); }
to { opacity: 1; transform: translate3d(0, 0, 0); }
}
@keyframes openElement {
from { opacity: 0; transform: translate3d(0, 25px, 0); }
to { opacity: 1; transform: translate3d(0, 0, 0); }
}
@media (max-width: 560px) {
.content-layout {
flex-direction: column;
gap: 0;
}
.content-display,
.content-layout.active-details .content-display {
flex: 0 0 auto;
}
.info-route-panel {
order: 2;
width: 100%;
max-height: 0;
margin-top: 0;
border-width: 0;
transition: max-height 0.7s cubic-bezier(0.16, 1, 0.3, 1),
opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
padding 0.7s cubic-bezier(0.16, 1, 0.3, 1),
margin-top 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}
.content-layout.active-details .info-route-panel {
width: 100%;
max-height: 600px;
margin-top: 12px;
border-width: 1px;
}
}
body.optimized .bubble { opacity: 0 !important; animation: none !important; }
body.optimized .search-box, 
body.optimized .suggestions-overlay, 
body.optimized .glass-card, 
body.optimized .content-display, 
body.optimized .info-route-panel, 
body.optimized .plus-card, 
body.optimized .optimize-btn {

-webkit-backdrop-filter: none !important;

:root {
--accent: #ffffff;
--accent-tint: rgba(255, 255, 255, 0.12);
--ios-yellow: #ffd60a;
--ios-label-2: rgba(235, 235, 245, 0.6);
--ios-label-3: rgba(235, 235, 245, 0.3);
--ios-separator: rgba(84, 84, 88, 0.6);
--ios-fill: rgba(118, 118, 128, 0.24);
--ios-spring: cubic-bezier(0.32, 0.72, 0, 1);
}
body { letter-spacing: -0.01em; }
.header h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; }
.header p { color: var(--ios-label-2); }
.search-box, .glass-card, .content-display, .info-route-panel, .optimize-btn, .suggestions-overlay {
backdrop-filter: saturate(180%) blur(20px);
-webkit-backdrop-filter: saturate(180%) blur(20px);
}
.search-box { height: 48px; border-radius: 14px; background: var(--ios-fill); }
.search-wrapper.fullscreen .search-box {
border-color: var(--accent);
box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08), var(--glass-shadow);
}
.search-input { caret-color: var(--accent); }
.suggestions-overlay { top: 56px; border-radius: 20px; border-color: var(--glass-border); }
.glass-card.is-active { border-color: var(--accent); background: var(--accent-tint); }
.glass-card:active { border-color: var(--accent); }
.floor-title { font-size: 13px; letter-spacing: 0; color: var(--ios-label-2); }
.room-chip {
background: var(--ios-fill);
border-color: transparent;
border-radius: 10px;
transition: transform 0.35s var(--ios-spring), background 0.2s ease;
}
.room-chip:active { transform: scale(0.92); background: var(--accent-tint); border-color: transparent; color: var(--accent); }
.room-card { transition: transform 0.35s var(--ios-spring), background 0.2s ease; }
.room-info .room-loc { color: var(--ios-label-2); }
.optimize-btn { border-radius: 999px; padding: 10px 16px; }
.unit-address { margin: -6px 0 18px; }
.route-address { margin-bottom: 10px; }
.addr-line { font-size: 14px; font-weight: 600; color: #fff; }
.addr-line.muted { font-weight: 400; color: var(--ios-label-2); }
.addr-place { font-size: 12px; color: var(--ios-label-2); margin-top: 2px; }
.unsure { color: var(--ios-yellow); }
.map-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.map-btn {
flex: 1 1 auto;
padding: 9px 14px;
border: 1px solid var(--glass-border);
border-radius: 999px;
background: var(--accent-tint);
color: var(--accent);
font: inherit;
font-size: 13px;
font-weight: 600;
cursor: pointer;
transition: transform 0.35s var(--ios-spring), background 0.2s ease;
}
.map-btn:active { transform: scale(0.94); background: var(--glass-active); }
.route-steps {
list-style: none;
counter-reset: step;
margin-top: 12px;
border-radius: 12px;
background: rgba(118, 118, 128, 0.12);
overflow: hidden;
}
.route-steps li {
counter-increment: step;
position: relative;
padding: 10px 12px 10px 42px;
font-size: 13px;
line-height: 1.4;
color: #fff;
}
.route-steps li + li { box-shadow: inset 0 0.5px 0 var(--ios-separator); }
.route-steps li::before {
content: counter(step);
position: absolute;
left: 12px;
top: 10px;
width: 20px;
height: 20px;
border-radius: 50%;
background: var(--accent);
color: var(--bg-main);
font-size: 11px;
font-weight: 700;
line-height: 20px;
text-align: center;
}
body.optimized .map-btn { background: rgba(255, 255, 255, 0.12) !important; }
.plus-card {
position: relative;
margin-bottom: 14px;
padding: 14px 16px;
border-radius: 20px;
background: var(--glass-base);
border: 1px solid var(--glass-border);
box-shadow: var(--glass-shadow);
backdrop-filter: saturate(180%) blur(20px);
-webkit-backdrop-filter: saturate(180%) blur(20px);
opacity: 0;
animation: openElement 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
}
.plus-card[hidden] { display: none; }
.quick-bar { display: flex; gap: 8px; margin-bottom: 10px; opacity: 0; animation: openElement 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.12s forwards; }
.quick-btn {
flex: 1 1 0; height: 40px; border-radius: 14px; cursor: pointer;
border: 1px solid var(--glass-border); background: var(--glass-base); color: #fff;

}
.quick-btn:active { transform: scale(0.95); background: var(--glass-active); }

.week-tab { flex: 1; height: 32px; border: none; border-radius: 9px; background: transparent; color: var(--ios-label-2); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.week-tab.on { background: rgba(255, 255, 255, 0.16); color: #fff; }
.today-badge { margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: #fff; color: var(--bg-main); font-size: 10px; font-weight: 700; text-transform: none; letter-spacing: 0; }
.lesson-row.is-link { cursor: pointer; }
.lesson-row.is-link:active { background: var(--glass-active); }
.lesson-row.is-live { box-shadow: inset 3px 0 0 #30d158; }
.lesson-row .lesson-day { flex-basis: 48px; }
.lesson-main small + small { margin-top: 1px; }
.lesson-kind { font-style: normal; padding: 0 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 11px; }
.lesson-kind.is-change { background: rgba(255, 214, 10, 0.2); color: var(--ios-yellow); }
.route-btn { width: 100%; margin-top: 10px; background: #fff; color: var(--bg-main); border-color: transparent; }
.route-btn:active { background: rgba(255, 255, 255, 0.8); }
.map-actions .map-btn { flex: 1 1 0; padding-left: 8px; padding-right: 8px; white-space: nowrap; }
.map-actions .map-btn[data-from-me] { flex: 2 1 0; }
.route-status { margin-bottom: 8px; }
.open-status { font-size: 12px; font-weight: 600; }
.open-status::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.open-status.is-open { color: #30d158; }
.open-status.is-open::before { background: #30d158; }
.open-status.is-closed { color: #ff6961; }
.open-status.is-closed::before { background: #ff6961; }
.near-food {
display: grid; gap: 2px; margin-top: 10px; padding: 10px 12px; border-radius: 12px; cursor: pointer;
background: rgba(118, 118, 128, 0.12); transition: transform 0.35s var(--ios-spring), background 0.2s ease;
}
.near-food:active { transform: scale(0.97); background: var(--glass-active); }
.near-food > span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--ios-label-2); }
.near-food b { font-size: 14px; color: #fff; }
.near-food small { font-size: 12px; color: var(--ios-label-2); }
.route-extra { display: flex; gap: 8px; margin-top: 10px; }
.route-extra .map-btn { flex: 1 1 0; width: auto; margin-top: 0; }
.recent-row { margin-bottom: 16px; }
.toast {
position: fixed; left: 50%; bottom: calc(80px + var(--sab)); z-index: 1200;
transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 999px;
background: rgba(40, 42, 50, 0.96); border: 1px solid var(--glass-border); color: #fff; font-size: 13px;
transition: opacity 0.3s ease, transform 0.4s var(--ios-spring);

try { localStorage.setItem(INTRO_KEY, today); } catch (err) { /* хранилище недоступно */ }
const letters = 'Навигатор СтГАУ'.split(' ');
let n = 0;
document.getElementById('wowWord').innerHTML = letters.map(word =>
`<span>${word.split('').map(ch => `<i style="animation-delay:${1.5 + (n++) * 0.035}s">${ch}</i>`).join('')}</span>`
).join('');
let left = false;
const leave = () => {
if (left) return;
left = true;
const holeRadius = 190 * 158 / 1024;
const zoom = Math.ceil(Math.hypot(innerWidth, innerHeight) / holeRadius);
document.getElementById('wowLogo').style.setProperty('--wow-zoom', zoom);
intro.classList.add('leaving');
setTimeout(go, 380);
setTimeout(() => intro.remove(), 900);
};
intro.addEventListener('pointerdown', leave);
setTimeout(leave, 2650);
}
function runSky() {
if (reduced) return;
const host = document.querySelector('.ambient-background');
if (!host) return;
const canvas = document.createElement('canvas');
canvas.className = 'wow-sky';
host.appendChild(canvas);
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, isAndroid ? 1 : 1.5);
const count = isAndroid ? 22 : 34;
const LINK = 150, LINK2 = LINK * LINK;
const LINE_SHADES = [0.02, 0.06, 0.1, 0.14];
const DOT_SHADES = [0.26, 0.34, 0.42, 0.5];
let w = 0, h = 0, pulses = [];
let px = 0, py = 0, tx = 0, ty = 0;
function resize() {
w = innerWidth; h = innerHeight;
canvas.width = w * dpr; canvas.height = h * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);
const nodes = [];
for (let i = 0; i < count; i++) {
const d = 0.3 + Math.random() * 0.7;
nodes.push({
x: Math.random() * w, y: Math.random() * h, sx: 0, sy: 0,
vx: (Math.random() - 0.5) * 0.14, vy: (Math.random() - 0.5) * 0.14,
d, shade: Math.min(3, Math.floor((d - 0.3) / 0.7 * 4))
});
}
function neighbour(a) {
const near = nodes.filter(n => n !== a && (n.x - a.x) ** 2 + (n.y - a.y) ** 2 < LINK2);
return near.length ? near[Math.floor(Math.random() * near.length)] : null;
}
addEventListener('pointermove', (e) => { tx = (e.clientX / w - 0.5) * 2; ty = (e.clientY / h - 0.5) * 2; }, { passive: true });
addEventListener('deviceorientation', (e) => {
if (e.gamma == null) return;
tx = Math.max(-1, Math.min(1, e.gamma / 25));
ty = Math.max(-1, Math.min(1, (e.beta - 45) / 25));
}, { passive: true });
let last = 0;
function frame(now) {
requestAnimationFrame(frame);
if (document.hidden || isOff() || now - last < 33) return;   // 30 кадров в секунду хватает
last = now;
px += (tx - px) * 0.05; py += (ty - py) * 0.05;
ctx.clearRect(0, 0, w, h);
for (let i = 0; i < count; i++) {
const n = nodes[i];
n.x += n.vx; n.y += n.vy;
if (n.x < -20) n.x = w + 20; else if (n.x > w + 20) n.x = -20;
if (n.y < -20) n.y = h + 20; else if (n.y > h + 20) n.y = -20;
n.sx = n.x + px * 22 * n.d;
n.sy = n.y + py * 22 * n.d;
}
ctx.lineWidth = 0.6;
for (let s = 0; s < 4; s++) {
ctx.strokeStyle = `rgba(255,255,255,${LINE_SHADES[s]})`;
ctx.beginPath();
for (let i = 0; i < count; i++) {
const a = nodes[i];
for (let j = i + 1; j < count; j++) {
const b = nodes[j];
const dx = a.sx - b.sx, dy = a.sy - b.sy, d2 = dx * dx + dy * dy;
if (d2 > LINK2) continue;
if (Math.min(3, Math.floor((1 - Math.sqrt(d2) / LINK) * 4)) !== s) continue;
ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy);
}
}
ctx.stroke();
ctx.fillStyle = `rgba(255,255,255,${DOT_SHADES[s]})`;
ctx.beginPath();
for (let i = 0; i < count; i++) {
const n = nodes[i];
if (n.shade !== s) continue;
const r = 0.7 + n.d;
ctx.moveTo(n.sx + r, n.sy);
ctx.arc(n.sx, n.sy, r, 0, 6.3);
}
ctx.fill();
}
if (pulses.length < 3 && Math.random() < 0.03) {
const a = nodes[Math.floor(Math.random() * count)], b = neighbour(a);
if (b) pulses.push({ a, b, t: 0 });
}
pulses = pulses.filter(p => {
p.t += 0.022;
if (p.t >= 1) {
const next = neighbour(p.b);
if (!next || Math.random() < 0.15) return false;
p.a = p.b; p.b = next; p.t = 0;
}
const x = p.a.sx + (p.b.sx - p.a.sx) * p.t, y = p.a.sy + (p.b.sy - p.a.sy) * p.t;
ctx.fillStyle = 'rgba(255,255,255,0.14)';
ctx.beginPath(); ctx.arc(x, y, 6, 0, 6.3); ctx.fill();
ctx.fillStyle = '#fff';
ctx.beginPath(); ctx.arc(x, y, 1.8, 0, 6.3); ctx.fill();
return true;
});
}
requestAnimationFrame(frame);
}
document.addEventListener('pointerdown', (e) => {
if (isOff()) return;
const el = e.target.closest && e.target.closest('.glass-card, .room-chip, .quick-btn, .map-btn, .room-card, .plus-row, .plus-plan');
if (!el) return;
const r = el.getBoundingClientRect();
el.style.setProperty('--mx', `${e.clientX - r.left}px`);
el.style.setProperty('--my', `${e.clientY - r.top}px`);
const ripple = document.createElement('div');
ripple.className = 'wow-ripple';
ripple.style.left = `${e.clientX}px`;
ripple.style.top = `${e.clientY}px`;
ripple.addEventListener('animationend', () => ripple.remove());
body.appendChild(ripple);
}, { passive: true });
function cascade(el, cls, delay) {
el.classList.add(cls);
el.style.animationDelay = `${delay}ms`;
}
new MutationObserver(() => {
if (isOff()) return;
let t = 0;
contentArea.querySelectorAll('.unit-title, .unit-sub, .unit-address, .floor-title, .room-chip, .room-info > *, .plus-section').forEach(el => {
if (el.classList.contains('room-chip')) { cascade(el, 'wow-pop', Math.min(t, 600)); t += 16; }
else if (el.classList.contains('floor-title')) { cascade(el, 'wow-slide', Math.min(t, 600)); t += 40; }
else { cascade(el, 'wow-in', Math.min(t, 600)); t += 60; }
});
}).observe(contentArea, { childList: true });
new MutationObserver(() => {
if (isOff()) return;
searchResultsList.querySelectorAll('.room-card').forEach((el, i) => {
if (i < 8) cascade(el, 'wow-in', i * 35);
});
}).observe(searchResultsList, { childList: true });
let sheetFresh = false;
const plainOpenSheet = openSheet;
openSheet = function (mode) {
sheetFresh = true;
plainOpenSheet(mode);
};
new MutationObserver(() => {
if (!sheetFresh || isOff()) return;
sheetFresh = false;
plusBody.querySelectorAll(':scope > *').forEach((el, i) => cascade(el, 'wow-in', 120 + i * 60));
}).observe(plusBody, { childList: true });
let towerTimers = [];
const later = (fn, ms) => towerTimers.push(setTimeout(fn, ms));
function towerHtml(room, total) {
let slabs = '';
for (let f = 1; f <= total; f++) {
const cls = f === room.floor ? 'is-target' : f > room.floor ? 'is-above' : 'is-below';
slabs += `<div class="wow-slab ${cls}" style="--n:${f - 1}">
<i class="fr"></i><i class="rt"></i><i class="top"></i>
${f === room.floor ? `<i class="wow-landing"></i>
<div class="wow-marker"><svg viewBox="0 0 34 46"><path d="M17 45 C13 38 2 28 2 16 A15 15 0 1 1 32 16 C32 28 21 38 17 45 Z" fill="#090a0f" stroke="#fff" stroke-width="2"/><circle cx="17" cy="16" r="5.5" fill="#fff"/></svg></div>` : ''}
</div>`;
}
return `<div class="wow-tower" aria-hidden="true" style="--floors:${total}">
<div class="wow-lift"><small>этаж</small><b>1</b></div>
<div class="wow-scene"><div class="wow-stack">${slabs}</div></div>
</div>`;
}
function playTower(room, total) {
const tower = routeContent.querySelector('.wow-tower');
if (!tower) return;
const num = tower.querySelector('.wow-lift b');
const start = total * 75 + 300;
for (let f = 2; f <= room.floor; f++) {
later(() => {
num.textContent = f;
num.classList.remove('tick');
void num.offsetWidth;
num.classList.add('tick');
haptic('light');
}, start + (f - 2) * 130);
}
const open = start + (room.floor - 1) * 130 + 80;
later(() => tower.querySelector('.wow-stack').classList.add('is-open'), open);
later(() => tower.querySelector('.wow-marker').classList.add('go'), open + 320);
later(() => {
tower.querySelector('.wow-landing').classList.add('go');
haptic('heavy');
}, open + 320 + 465);
return open + 700;
}
const plainShowDetails = showDetails;
showDetails = function (room) {
plainShowDetails(room);
towerTimers.forEach(clearTimeout);
towerTimers = [];
if (isOff()) return;
let wait = 150;
const unit = UNITS.find(u => u.code === room.unit);
const known = unit && unit.floorList ? unit.floorList : [];
if (room.floor && !room.unitPlace && known.length) {
const total = Math.max(room.floor, ...known);
routeContent.insertAdjacentHTML('afterbegin', towerHtml(room, total));
wait = playTower(room, total);
}
routeContent.querySelectorAll('.route-address, .map-btn, .route-steps li, .near-food, .route-extra').forEach((el, i) => {
if (!el.closest('.route-extra') || el.classList.contains('route-extra')) {
cascade(el, 'wow-in', Math.min(wait, 900) * 0.5 + i * 70);
}
});
};
document.documentElement.classList.add('wow');
unitGrid.querySelectorAll('.glass-card').forEach((card, i) => card.style.setProperty('--i', i));
runSky();
runIntro();
})();
</script>
