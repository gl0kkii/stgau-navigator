html.fold-h body, html.fold-v body {

height: 100vh;
height: 100dvh;
min-height: 0;
overflow: hidden;
padding: 0;
}
html.fold-h .grid-container.units, html.fold-v .grid-container.units {
grid-template-columns: repeat(3, 1fr);
grid-auto-rows: max-content;
align-content: start;
overflow-y: auto;
min-height: 0;
padding-bottom: 56px;
}
html.fold-h .content-layout, html.fold-v .content-layout {

gap: 0;
min-height: 0;
overflow-y: auto;
padding: 12px;
}
html.fold-h .content-display, html.fold-v .content-display,
html.fold-h .content-layout.active-details .content-display, html.fold-v .content-layout.active-details .content-display { flex: 0 0 auto; }
html.fold-h .info-route-panel, html.fold-v .info-route-panel { order: 2; width: 100%; max-height: 0; margin-top: 0; border-width: 0; }
html.fold-h .content-layout.active-details .info-route-panel, html.fold-v .content-layout.active-details .info-route-panel { width: 100%; max-height: 1000px; margin-top: 12px; border-width: 1px; flex-shrink: 0; }
html.fold-h body {
grid-template-columns: var(--seg-a) var(--hinge) var(--seg-b);
grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
}
html.fold-h .header, html.fold-h .search-wrapper, html.fold-h .quick-bar, html.fold-h .plus-card, html.fold-h .grid-container.units, html.fold-h .page-foot { grid-column: 1; margin-left: 12px; margin-right: 12px; }
html.fold-h .header { padding-top: calc(12px + var(--sat)); margin-bottom: 12px; }
html.fold-h .header h1 { font-size: 26px; }
html.fold-h .page-foot { margin-top: 0; margin-bottom: 8px; text-align: right; }
html.fold-h .grid-container.units { margin-bottom: 8px; }
html.fold-h .content-layout { grid-column: 3; grid-row: 1 / -1; padding-top: calc(12px + var(--sat)); padding-bottom: calc(12px + var(--sab)); }
html.fold-h .plus-sheet-inner { left: calc(var(--seg-a) + var(--hinge)); }
html.fold-v body {

}
html.fold-v .header, html.fold-v .plus-card, html.fold-v .page-foot { display: none; }
html.fold-v .content-layout { grid-row: 1; padding-top: calc(12px + var(--sat)); }
html.fold-v .search-wrapper { grid-row: 3; margin: 10px 12px 8px; }
html.fold-v .quick-bar { grid-row: 4; margin: 0 12px 8px; }

html.fold-v .plus-sheet-inner { top: calc(var(--seg-a) + var(--hinge)); max-height: none; }
:root { --wow-spring: cubic-bezier(0.34, 1.56, 0.64, 1); --wow-out: cubic-bezier(0.16, 1, 0.3, 1); }
.wow-intro-screen {
position: fixed; inset: 0; z-index: 3000;
display: flex; flex-direction: column; align-items: center; justify-content: center;
background: radial-gradient(circle at 50% 40%, #161922 0%, #090a0f 70%);
cursor: pointer; overflow: hidden;
animation: wowIntroFailsafe 0.3s linear 6s forwards;
}
@keyframes wowIntroFailsafe { to { opacity: 0; visibility: hidden; } }
body.wow-intro > *:not(.wow-intro-screen) { animation-play-state: paused !important; }
.wow-logo { position: relative; width: 190px; height: 190px; transform-origin: 50% 43.46%; }
.wow-logo svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.wow-pin-line { fill: none; stroke: #fff; stroke-width: 6; stroke-dasharray: 1; stroke-dashoffset: 1; animation: wowDraw 0.8s cubic-bezier(0.6, 0, 0.3, 1) 0.1s forwards; }
.wow-pin-fill { opacity: 0; animation: wowFade 0.35s ease 0.75s forwards; }
.wow-hole { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: wowPop 0.55s var(--wow-spring) 0.8s forwards; }
.wow-temple > * { transform-box: fill-box; opacity: 0; animation: wowBuild 0.45s var(--wow-spring) forwards; }
.wow-temple .up { transform-origin: 50% 100%; }
.wow-temple .wide { transform-origin: 50% 50%; }
@keyframes wowDraw { to { stroke-dashoffset: 0; } }
@keyframes wowFade { to { opacity: 1; } }
@keyframes wowPop { to { transform: scale(1); } }
@keyframes wowBuild { from { opacity: 0; transform: scale(0.4, 0); } to { opacity: 1; transform: none; } }
.wow-ring { position: absolute; left: 50%; top: 43.46%; width: 190px; height: 190px; margin: -95px 0 0 -95px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.5); opacity: 0; animation: wowSonar 1.5s var(--wow-out) forwards; }
@keyframes wowSonar { 0% { opacity: 0.8; transform: scale(0.4); } 100% { opacity: 0; transform: scale(3.4); } }
.wow-word { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 10px; margin-top: 26px; padding: 0 16px; font-size: 30px; font-weight: 700; color: #fff; }
.wow-word span { display: inline-flex; }
.wow-word i { font-style: normal; opacity: 0; transform: translate3d(0, 22px, 0) scale(0.8); animation: wowLetter 0.6s var(--wow-spring) forwards; }
@keyframes wowLetter { to { opacity: 1; transform: none; } }
.wow-intro-screen.leaving { animation: wowIntroOut 0.45s ease 0.3s forwards; pointer-events: none; }
@keyframes wowIntroOut { to { opacity: 0; visibility: hidden; } }
.leaving .wow-word { opacity: 0; transition: opacity 0.15s; }
.leaving .wow-temple, .leaving .wow-ring { opacity: 0; transition: opacity 0.12s; }
.leaving .wow-logo { transition: transform 0.75s cubic-bezier(0.7, 0, 0.3, 1); transform: scale(var(--wow-zoom, 24)); }
.wow-sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

@keyframes wowTitleSheen { to { background-position: 0 0; } }
html.wow body.wow-go:not(.optimized) .units .glass-card { animation: wowCardIn 0.85s var(--wow-spring) backwards; animation-delay: calc(var(--i) * 55ms); }
@keyframes wowCardIn { from { opacity: 0; transform: perspective(700px) rotateX(-75deg) translate3d(0, 34px, 0) scale(0.82); } }

html.wow body:not(.optimized) .glass-card::after {
content: ''; position: absolute; left: var(--mx, 50%); top: var(--my, 50%); width: 180px; height: 180px; margin: -90px 0 0 -90px;

content: ''; position: absolute; top: -20%; bottom: -20%; left: 0; width: 45%;

@keyframes wowRipple { from { opacity: 0.9; transform: scale(0.1); } to { opacity: 0; transform: scale(1); } }
.wow-in { animation: wowRise 0.6s var(--wow-out) backwards; }
@keyframes wowRise { from { opacity: 0; transform: translate3d(0, 16px, 0); } }
