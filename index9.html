<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Навигатор СтГАУ</title>
    <!-- Telegram WebApp JS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #090a0f;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-tertiary: rgba(255, 255, 255, 0.4);

            --glass-base: rgba(255, 255, 255, 0.05);
            --glass-hover: rgba(255, 255, 255, 0.09);
            --glass-active: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-border-glow: rgba(255, 255, 255, 0.4);
            
            --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 
                            inset 0 1px 1px rgba(255, 255, 255, 0.25);
            
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        /* FIX: поле ввода должно оставаться выделяемым, иначе на iOS ломается ввод/редактирование */
        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: var(--tg-viewport-height, 100vh);
            /* FIX: снизу запас под фиксированную кнопку «Оптимизация», чтобы она не перекрывала контент */
            padding: calc(24px + var(--sat)) 16px calc(80px + var(--sab)) 16px;
            overflow-x: hidden;
            /* FIX: убран perspective — он делал body контейнером для position:fixed,
               и фон с кнопкой «Оптимизация» уезжали при прокрутке */
            -webkit-font-smoothing: antialiased;
        }

        .ambient-background {
            position: fixed;
            /* FIX: inset вместо 100vw/100vh — без горизонтального переполнения и «прыжков» на мобильных */
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 10%, #161922 0%, #090a0f 80%);
            pointer-events: none;
            transform: translate3d(0, 0, 0);
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.22;
            will-change: transform;
            backface-visibility: hidden;
            transition: opacity 0.5s ease;
        }

        .bubble-1 { width: 280px; height: 280px; background: #ffffff; top: 5%; left: -10%; animation: floatChaotic1 24s infinite ease-in-out; }
        .bubble-2 { width: 340px; height: 340px; background: #8e8e93; bottom: -5%; right: -15%; animation: floatChaotic2 30s infinite ease-in-out; }
        .bubble-3 { width: 220px; height: 220px; background: #aeaeb2; top: 40%; left: 30%; animation: floatChaotic3 22s infinite ease-in-out; }

        @keyframes floatChaotic1 {
            0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
            50% { transform: translate3d(-40px, 140px, 0) scale(0.9) rotate(90deg); }
            100% { transform: translate3d(0, 0, 0) scale(1) rotate(180deg); }
        }

        @keyframes floatChaotic2 {
            0% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(-30px, -150px, 0) scale(0.85); }
            100% { transform: translate3d(0, 0, 0); }
        }

        @keyframes floatChaotic3 {
            0% { transform: translate3d(0, 0, 0) scale(0.9); }
            50% { transform: translate3d(-70px, 90px, 0) scale(1.2); }
            100% { transform: translate3d(0, 0, 0) scale(0.9); }
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
            padding: 0 8px;
            will-change: transform, opacity;
            animation: openHeader 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin-bottom: 8px;
            color: #ffffff;
            background: linear-gradient(180deg, #ffffff 40%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* FIX: text-shadow просвечивал сквозь прозрачный текст и мутил градиент */
            filter: drop-shadow(0 4px 20px rgba(255, 255, 255, 0.15));
        }

        .header p {
            font-size: 15px;
            font-weight: 400;
            letter-spacing: -0.01em;
            color: var(--text-secondary);
        }

        .search-wrapper { 
            position: relative; 
            z-index: 100; 
            margin-bottom: 20px; 
            opacity: 0;
            animation: openElement 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        .search-box {
            position: relative;
            width: 100%;
            height: 54px;
            background: var(--glass-base);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            box-shadow: var(--glass-shadow);
            display: flex;
            align-items: center;
            padding: 0 16px;
            cursor: pointer;
            will-change: border-color, background, box-shadow;
            transition: border-color 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        background 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-icon { font-size: 16px; margin-right: 12px; opacity: 0.6; }
        .search-input { width: 100%; height: 100%; background: transparent; border: none; outline: none; color: var(--text-primary); font-size: 16px; font-weight: 400; }
        .search-input::placeholder { color: var(--text-tertiary); }

        .close-btn {
            opacity: 0;
            transform: scale(0.5) rotate(-90deg) translate3d(0,0,0);
            pointer-events: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #fff;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 8px;
            flex-shrink: 0;
            will-change: transform, opacity;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .close-btn:active { transform: scale(0.9) translate3d(0,0,0); background: rgba(255, 255, 255, 0.25); }

        .search-wrapper.fullscreen .search-box {
            border-color: var(--glass-border-glow);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.12), var(--glass-shadow);
        }

        .search-wrapper.fullscreen .close-btn {
            opacity: 1;
            transform: scale(1) rotate(0deg) translate3d(0,0,0);
            pointer-events: auto;
        }

        .suggestions-overlay {
            position: absolute;
            top: 62px;
            left: 0;
            width: 100%;
            max-height: calc(100vh - 200px);
            /* FIX: в Telegram 100vh неточен — берём стабильную высоту вьюпорта от Telegram */
            max-height: calc(var(--tg-viewport-stable-height, 100vh) - 200px);
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            background: rgba(12, 14, 20, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border-glow);
            border-radius: 26px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            z-index: 999;
            padding: 20px 16px;
            overflow-y: auto;
            
            opacity: 0;
            pointer-events: none;
            transform: scaleY(0) scaleX(0.92) translate3d(0,0,0);
            transform-origin: top center;
            will-change: transform, opacity;
            transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-wrapper.fullscreen .suggestions-overlay {
            opacity: 1;
            pointer-events: auto;
            transform: scaleY(1) scaleX(1) translate3d(0,0,0);
        }

        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            margin-bottom: 20px; 
            opacity: 0;
            animation: openElement 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .glass-card {
            background: var(--glass-base);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 16px;
            text-align: left;
            cursor: pointer;
            box-shadow: var(--glass-shadow);
            position: relative;
            overflow: hidden;
            will-change: transform, background, border-color;
            transform: translate3d(0,0,0);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.4s ease, background 0.4s ease;
        }

        .glass-card:active { transform: scale(0.95) translate3d(0,0,0) !important; background: var(--glass-active); border-color: #ffffff; }
        .glass-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: #ffffff; }
        .glass-card p { font-size: 12px; color: var(--text-secondary); }

        /* Сетка подразделений: 3 колонки компактных карточек */
        .grid-container.units { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 10px; }
        .grid-container.units .glass-card { padding: 14px 12px; border-radius: 18px; }
        .grid-container.units .glass-card h3 { font-size: 16px; letter-spacing: -0.01em; }
        .grid-container.units .glass-card p { font-size: 11px; line-height: 1.3; }
        .glass-card.is-active { border-color: var(--glass-border-glow); background: var(--glass-hover); }

        /* Список кабинетов подразделения: этажи + «чипы» с номерами */
        .unit-title { font-size: 17px; font-weight: 700; margin-bottom: 2px; color: #fff; }
        .unit-sub { font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.4; }
        .floor-group { margin-bottom: 16px; }
        .floor-group:last-child { margin-bottom: 0; }
        .floor-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }
        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .room-chip {
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }
        .room-chip:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.35); }
        .search-note { font-size: 12px; color: var(--text-tertiary); text-align: center; padding: 8px 0 2px; }

        .content-layout {
            display: flex;
            gap: 12px;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: openElement 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .content-display {
            flex: 1;
            background: var(--glass-base);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--glass-shadow);
            min-height: 220px;
            will-change: opacity, flex;
            transition: flex 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }

        .info-route-panel {
            width: 0;
            opacity: 0;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 0;
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            justify-content: center;
            will-change: width, opacity, padding;
            transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                        padding 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            flex-shrink: 0;
        }

        .content-layout.active-details .info-route-panel {
            width: 55%;
            opacity: 1;
            padding: 18px;
        }

        .content-layout.active-details .content-display {
            flex: 45%;
        }

        .room-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            will-change: transform, background;
            transition: transform 0.25s ease, background 0.25s ease;
        }

        .room-card:active { transform: scale(0.98) translate3d(0,0,0); background: rgba(255, 255, 255, 0.1); }
        .room-info h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: #fff; }
        .room-info .room-loc { font-size: 12px; color: #a1a1aa; margin-bottom: 2px; }
        .room-info .room-desc { font-size: 11px; color: var(--text-secondary); }

        .optimize-btn {
            position: fixed;
            bottom: max(16px, env(safe-area-inset-bottom, 16px));
            left: 16px;
            z-index: 1000;
            background: var(--glass-base);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 500;
            box-shadow: var(--glass-shadow);
            cursor: pointer;
            will-change: transform, background;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.3s ease, border-color 0.3s ease;
        }

        .optimize-btn:active {
            transform: scale(0.92) translate3d(0,0,0);
            background: var(--glass-active);
            border-color: #fff;
        }

        @keyframes openHeader {
            from { opacity: 0; transform: translate3d(0, -20px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        @keyframes openElement {
            from { opacity: 0; transform: translate3d(0, 25px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        /* FIX: на узких экранах панель маршрута 55% ширины была ~180px — текст не помещался.
           На телефоне панель раскрывается под карточкой во всю ширину. */
        @media (max-width: 560px) {
            .content-layout {
                flex-direction: column;
                gap: 0;
            }
            .content-display,
            .content-layout.active-details .content-display {
                flex: 0 0 auto;
            }
            .info-route-panel {
                order: 2;
                width: 100%;
                max-height: 0;
                margin-top: 0;
                border-width: 0;
                transition: max-height 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                            opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                            padding 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                            margin-top 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .content-layout.active-details .info-route-panel {
                width: 100%;
                max-height: 600px;
                margin-top: 12px;
                border-width: 1px;
            }
        }

        /* Безопасный режим оптимизации: отключает только тяжелые размытия, пузыри и tilt-эффект, не ломая интерфейс */
        body.optimized .bubble { opacity: 0 !important; animation: none !important; }
        body.optimized .search-box, 
        body.optimized .suggestions-overlay, 
        body.optimized .glass-card, 
        body.optimized .content-display, 
        body.optimized .info-route-panel, 
        body.optimized .optimize-btn {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            background: rgba(20, 22, 30, 0.95) !important;
        }

        /* =====================================================================
           APPLE-СТИЛИСТИКА: цвета и материалы iOS поверх текущего дизайна
           (белый «стеклянный» акцент в тон дизайну, «вибрирующее» стекло, сгруппированные списки,
           пружинные нажатия). Чтобы вернуть как было — удалите этот блок.
           ===================================================================== */
        :root {
            --accent: #ffffff;
            --accent-tint: rgba(255, 255, 255, 0.12);
            --ios-yellow: #ffd60a;
            --ios-label-2: rgba(235, 235, 245, 0.6);
            --ios-label-3: rgba(235, 235, 245, 0.3);
            --ios-separator: rgba(84, 84, 88, 0.6);
            --ios-fill: rgba(118, 118, 128, 0.24);
            --ios-spring: cubic-bezier(0.32, 0.72, 0, 1);
        }

        body { letter-spacing: -0.01em; }

        /* Large Title как в навигации iOS */
        .header h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; }
        .header p { color: var(--ios-label-2); }

        /* Материал: размытие + насыщенность, как у системных панелей */
        .search-box, .glass-card, .content-display, .info-route-panel, .optimize-btn, .suggestions-overlay {
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
        }

        /* Поиск — как системное поле Search */
        .search-box { height: 48px; border-radius: 14px; background: var(--ios-fill); }
        .search-wrapper.fullscreen .search-box {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08), var(--glass-shadow);
        }
        .search-input { caret-color: var(--accent); }
        .suggestions-overlay { top: 56px; border-radius: 20px; border-color: var(--glass-border); }

        /* Выбранное подразделение подсвечено акцентом */
        .glass-card.is-active { border-color: var(--accent); background: var(--accent-tint); }
        .glass-card:active { border-color: var(--accent); }

        /* Заголовки секций как в «Настройках» */
        .floor-title { font-size: 13px; letter-spacing: 0; color: var(--ios-label-2); }

        /* Номера кабинетов — тонированные кнопки */
        .room-chip {
            background: var(--ios-fill);
            border-color: transparent;
            border-radius: 10px;
            transition: transform 0.35s var(--ios-spring), background 0.2s ease;
        }
        .room-chip:active { transform: scale(0.92); background: var(--accent-tint); border-color: transparent; color: var(--accent); }

        .room-card { transition: transform 0.35s var(--ios-spring), background 0.2s ease; }
        .room-info .room-loc { color: var(--ios-label-2); }

        /* Кнопка «Оптимизация» — капсула */
        .optimize-btn { border-radius: 999px; padding: 10px 16px; }

        /* ---- Маршрут ---- */
        .unit-address { margin: -6px 0 18px; }
        .route-address { margin-bottom: 10px; }
        .addr-line { font-size: 14px; font-weight: 600; color: #fff; }
        .addr-line.muted { font-weight: 400; color: var(--ios-label-2); }
        .addr-place { font-size: 12px; color: var(--ios-label-2); margin-top: 2px; }
        .unsure { color: var(--ios-yellow); }

        .map-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .map-btn {
            flex: 1 1 auto;
            padding: 9px 14px;
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            background: var(--accent-tint);
            color: var(--accent);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.35s var(--ios-spring), background 0.2s ease;
        }
        .map-btn:active { transform: scale(0.94); background: var(--glass-active); }

        /* Шаги — сгруппированный список iOS с номерами */
        .route-steps {
            list-style: none;
            counter-reset: step;
            margin-top: 12px;
            border-radius: 12px;
            background: rgba(118, 118, 128, 0.12);
            overflow: hidden;
        }
        .route-steps li {
            counter-increment: step;
            position: relative;
            padding: 10px 12px 10px 42px;
            font-size: 13px;
            line-height: 1.4;
            color: #fff;
        }
        .route-steps li + li { box-shadow: inset 0 0.5px 0 var(--ios-separator); }
        .route-steps li::before {
            content: counter(step);
            position: absolute;
            left: 12px;
            top: 10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--bg-main);
            font-size: 11px;
            font-weight: 700;
            line-height: 20px;
            text-align: center;
        }

        body.optimized .map-btn { background: rgba(255, 255, 255, 0.12) !important; }

        /* =====================================================================
           ANDROID: тот же вид, что на iOS, но без лагов (класс .android ставит скрипт)
           ---------------------------------------------------------------------
           Лагало из-за backdrop-filter: пока пузыри двигаются, каждая стеклянная
           карточка заново размывает фон в каждом кадре. Но фон под карточками и так
           размыт (пузыри — это пятна blur 40px), поэтому повторное размытие глазом
           почти не видно. На Android убираем только его, а пузыри рисуем готовым
           градиентом вместо filter: blur. Цвета, тени и анимации — как на iOS.
           ===================================================================== */
        .android .search-box,
        .android .glass-card,
        .android .content-display,
        .android .info-route-panel,
        .android .optimize-btn,
        .android .suggestions-overlay {
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        /* Градиент рисуем шире самого круга: так он повторяет мягкий край blur(40px) */
        .android .bubble { filter: none; margin: -80px; padding: 80px; box-sizing: content-box; }
        .android .bubble-1 { background: radial-gradient(closest-side, #ffffff 30%, rgba(255, 255, 255, 0) 100%); }
        .android .bubble-2 { background: radial-gradient(closest-side, #8e8e93 30%, rgba(142, 142, 147, 0) 100%); }
        .android .bubble-3 { background: radial-gradient(closest-side, #aeaeb2 30%, rgba(174, 174, 178, 0) 100%); }
    </style>
</head>
<body>

    <div class="ambient-background">
        <div class="stgau-watermark"></div>
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
    </div>

    <div class="header">
        <h1>Навигатор СтГАУ</h1>
        <p>Интерактивная система кампуса</p>
    </div>

    <div class="search-wrapper" id="searchWrapper">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="Кабинет или подразделение" autocomplete="off">
            <button class="close-btn" onclick="closeFullscreenSearch(event)">✕</button>
        </div>

        <div class="suggestions-overlay">
            <div id="searchResultsList"></div>
        </div>
    </div>

    <div class="grid-container units" id="unitGrid"></div>

    <div class="content-layout" id="contentLayout">
        <div class="info-route-panel" id="infoRoutePanel">
            <h4 style="font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #fff;">🧭 Маршрут и Инфо</h4>

        </div>
        <div class="content-display" id="contentArea">
            <p style="text-align: center; color: var(--text-secondary); font-size: 13px; padding-top: 50px;">
                Выберите подразделение или найдите кабинет через поиск
            </p>
        </div>
    </div>

    <button class="optimize-btn" id="optimizeBtn" onclick="toggleOptimization()">Оптимизация</button>

    <script>
        // Если telegram-web-app.js не загрузился (или страница открыта вне Telegram) — работаем как обычная страница
        const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
        if (tg) {
            try { tg.expand(); tg.ready(); } catch (err) { /* вне Telegram — игнорируем */ }
        }

        // Android (браузер и Telegram) плохо тянет размытие фона поверх движущихся пузырей —
        // убираем только его, вид остаётся прежним (см. блок «ANDROID» в стилях)
        const isAndroid = /android/i.test(navigator.userAgent) || !!(tg && tg.platform === 'android');
        if (isAndroid) document.documentElement.classList.add('android');

        const tgSupports = (version) => !!(tg && typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast(version));

        function haptic(style) {
            if (!tgSupports('6.1')) return;
            try { tg.HapticFeedback.impactOccurred(style); } catch (err) { /* нет поддержки — молчим */ }
        }

        // Экранирование всего, что вставляется в innerHTML
        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /* =====================================================================
           ДАННЫЕ: кабинеты СтГАУ (из файла kabinety_stgau.docx)
           ---------------------------------------------------------------------
           code    — код подразделения из расписания
           name    — полное название (null — пока не заполнено, показывается только код)
           note    — пояснение под заголовком подразделения
           floors  — кабинеты с известным этажом: { этаж: 'номера через запятую' }
           noFloor — кабинеты без определённого этажа: [{ label, rooms }]
           Чтобы добавить кабинет — допишите номер в нужную строку.
           ===================================================================== */
        const UNITS = [
            {

                floors: {
                    1: '189, 190, 191, 197',

                floors: {
                    1: '104, 105, 120',
                    2: '218, 219',
                    3: '303, 304, 305, 315, 316, 317',
                    4: '403, 418, 420',
                    5: '505, 517, 518, 519'
                }
            },
            {
                code: 'ИАПР', name: null,
                floors: {
                    2: '248, 251, 257, 258, 261, 264, 265, 266, 267, 268, 269, 269А, 270, 271, 275, 276'
                }
            },
            {
                code: 'ЗиК', name: null,
                floors: { 2: '277, 278, 279, 280, 281, 282' }
            },
            {
                code: 'ДП', name: null,
                floors: { 3: '310, 312' }
            },
            {
                code: 'ФВМ', name: 'Факультет ветеринарной медицины',
                floors: { 1: '102, 103, 105, 106, 107, 108' },
                noFloor: [
                    { label: null, rooms: '1, 2, 6, 7, 13, 14, 15, 17, 18, 19, 22, 25, 27, 29, 30, 34, 35, 38, 40, 44, 46, 47, 48, 49, 50, 52, 52а, Секционный зал' }
                ]
            },

                floors: {
                    1: '160',

                },

                ]
            },
            {

                noFloor: [
                    { label: null, rooms: '114, 115, 118, 122, 125, 126, 130, 131, 132, 133, 138, 140, 141, 142, 143, 143а, 144, 149, 153а, 154, 158, 159, 164, 165, 166, 175, 177, 178, 180, 183, 184' }
                ]
            },
            {
                code: 'АДМ', name: null,

            },

            },
            {
                // Столовые стоят в разных корпусах, поэтому у каждой группы свой адрес (building)
                // и своя подсказка (hint). Источник: stgau.ru/sveden/catering и 2ГИС
                code: 'Столовые', name: 'Столовые и буфеты', place: true,

                noFloor: [

                      building: { address: 'пер. Зоотехнический, 12', place: 'Главный учебный корпус' },
                      hint: 'Внутри главного корпуса спросите на вахте, где буфет.' },
                    { label: 'Корпус механики и энергетики', rooms: 'Студенческая столовая ИМЭ',
                      building: { address: 'пер. Зоотехнический, 12а', place: 'Учебно-лабораторный корпус Института механики и энергетики' },
                      hint: 'Столовая находится в учебно-лабораторном корпусе ИМЭ.' },
                    { label: 'ул. Мира, 347', rooms: 'Буфет «Модус»',
                      building: { address: 'ул. Мира, 347', place: 'Учебный корпус на Мира' },

                      hint: 'Столовая — по адресу ул. Пушкина, 17.' },
                    { label: 'ул. Серова, 523', rooms: 'Столовая ветфака',
                      building: { address: 'ул. Серова, 523', place: 'Корпус факультета ветеринарной медицины' },

        /* =====================================================================
           АДРЕСА КОРПУСОВ (для маршрутов) — по данным stgau.ru/sveden/struct и 2ГИС
           ---------------------------------------------------------------------
           address — адрес корпуса (город подставляется автоматически)
           place   — как называется здание
           unsure  — true, если адрес предположительный: в интерфейсе будет пометка «уточните»
           null    — адрес не найден, маршрут подскажет спросить на вахте
           ===================================================================== */
        const CITY = 'Ставрополь';
        const BUILDINGS = {
            'АДМ':  { address: 'пер. Зоотехнический, 12', place: 'Главный корпус (ректорат)' },
            'ИТФ':  { address: 'ул. Мира, 347, корп. 4', place: 'Инженерно-технологический факультет' },
            'ИДПО': { address: 'пер. Зоотехнический, 12, стр. 1', place: 'Корпус ИДПО' },
            'ЭиФ':  { address: 'ул. Мира, 347, корп. 2', place: 'Факультет экономики, финансов и цифровых технологий' },
            'ИАПР': { address: 'ул. Мира, 302', place: 'Институт агробиологии и природных ресурсов' },
            'ЗиК':  { address: 'ул. Мира, 302', place: 'Факультет агробиологии и земельных ресурсов' },
            'ФВМ':  { address: 'ул. Серова, 523', place: 'Институт ветеринарии и биотехнологий' },
            'БТФ':  { address: 'пер. Зоотехнический, 12', place: 'Биотехнологический факультет' },
            'НПЦ':  { address: 'пр. Волго-Донской, 97А', place: 'НПЦ Агробиотехнологий' },
            'НК':   { address: 'ул. Мира, 347, корп. 6', place: 'Новый корпус' },
            'ДП':   null
        };

        const mapQuery = (b) => encodeURIComponent(`${CITY}, ${b.address}`);
        const MAP_LINKS = {
            yandex: (b) => `https://yandex.ru/maps/?text=${mapQuery(b)}`,
            apple:  (b) => `https://maps.apple.com/?q=${mapQuery(b)}`
        };

        function openMap(kind, address) {
            if (!address || !MAP_LINKS[kind]) return;
            const url = MAP_LINKS[kind]({ address });
            haptic('light');
            // В Telegram ссылки открываем через WebApp API, иначе — новой вкладкой
            if (tg && typeof tg.openLink === 'function') {
                try { tg.openLink(url); return; } catch (err) { /* старый клиент — ниже обычный способ */ }
            }
            window.open(url, '_blank', 'noopener');
        }

        // b — объект здания { address, place } (из BUILDINGS или из группы столовых)
        function mapButtonsHtml(b) {
            if (!b) return '';
            const addr = escapeHtml(b.address);
            return `
                <div class="map-actions">
                    <button class="map-btn" data-map="yandex" data-addr="${addr}">Яндекс Карты</button>
                    <button class="map-btn" data-map="apple" data-addr="${addr}">Apple Карты</button>
                </div>
            `;
        }

        function addressHtml(b) {
            if (!b) return `<div class="addr-line muted">Адрес корпуса пока не добавлен</div>`;
            return `
                <div class="addr-line">${escapeHtml(b.address)}</div>
                <div class="addr-place">${escapeHtml(b.place)}${b.unsure ? ' · <span class="unsure">адрес уточняется</span>' : ''}</div>
            `;
        }

        /* ---------- Сборка базы помещений из UNITS ---------- */

        const splitRooms = (str) => str.split(',').map(s => s.trim()).filter(Boolean);
        const isNumbered = (room) => /^\d/.test(room);
        const unitLabel = (unit) => unit.place ? unit.name : unit.name ? `${unit.code} · ${unit.name}` : unit.code;

        // Поиск: регистр не важен, латинская «a» = кириллическая «а», ё = е
        const normalize = (s) => String(s).toLowerCase()
            .replace(/a/g, 'а').replace(/e/g, 'е').replace(/o/g, 'о').replace(/c/g, 'с')
            .replace(/ё/g, 'е');

        // Маршрут — список шагов: как добраться до корпуса → этаж → кабинет
        function buildRoute(unit, floor, sub, room, b, hint) {
            const where = sub ? `${unit.code} (${sub})` : unit.code;
            const steps = [];

            if (unit.place) steps.push(`Доберитесь до адреса: ${CITY}, ${b.address}.`);
            else steps.push(b
                ? `Доберитесь до корпуса ${where}: ${CITY}, ${b.address}.`
                : `Адрес корпуса ${where} пока не добавлен — спросите на вахте любого корпуса СтГАУ.`);

            if (hint) steps.push(hint);
            else if (floor === 1) steps.push('Кабинет на 1 этаже — подниматься не нужно.');
            else if (floor) steps.push(`Поднимитесь на ${floor} этаж.`);
            else steps.push(`Этаж в расписании не указан — уточните у охраны корпуса ${where}.`);

            steps.push(isNumbered(room)
                ? `Ищите табличку «${room}» в коридоре.`
                : `Ищите вывеску: ${room}.`);
            return steps;
        }

        const roomsDatabase = [];
        UNITS.forEach(unit => {
            unit.total = 0;
            unit.floorList = [];

            Object.keys(unit.floors || {}).map(Number).sort((a, b) => a - b).forEach(floor => {
                unit.floorList.push(floor);
                splitRooms(unit.floors[floor]).forEach(room => addRoom(unit, room, floor, null));
            });

            (unit.noFloor || []).forEach(group => {
                splitRooms(group.rooms).forEach(room => addRoom(unit, room, null, group.label, group));
            });
        });

        function addRoom(unit, room, floor, sub, group) {
            const numbered = isNumbered(room);
            const title = numbered ? `Кабинет ${room}` : room;
            const building = (group && group.building) || BUILDINGS[unit.code] || null;
            const location = floor
                ? (numbered ? `${floor} этаж, каб. ${room}` : `${floor} этаж`)
                : (unit.place ? building.address : 'Этаж не указан');
            const entry = {
                id: String(roomsDatabase.length),
                unit: unit.code,
                unitName: unitLabel(unit) + (sub ? ` · ${sub}` : ''),
                number: room,
                numbered, title, floor, sub, location, building, unitPlace: !!unit.place,
                route: buildRoute(unit, floor, sub, room, building, group && group.hint)
            };
            entry.haystack = normalize([room, title, unit.code, unit.name || '', sub || '', floor ? `${floor} этаж` : '', building ? building.address : ''].join(' '));
            entry.numberNorm = normalize(room);
            roomsDatabase.push(entry);
            unit.total++;
        }

        // «1, 3–6» — компактная запись списка этажей
        function formatFloors(list) {
            if (!list.length) return '';
            const parts = [];
            let start = list[0], prev = list[0];
            for (let i = 1; i <= list.length; i++) {
                if (list[i] === prev + 1) { prev = list[i]; continue; }
                parts.push(start === prev ? `${start}` : `${start}–${prev}`);
                start = prev = list[i];
            }
            return parts.join(', ');
        }

        // Для столовых считаем «места», для остальных — кабинеты
        const countLabel = (unit, n) => unit.place ? `${n} мест${n === 1 ? 'о' : n < 5 ? 'а' : ''}` : `${n} ${roomsWord(n)}`;

        function roomsWord(n) {
            const m10 = n % 10, m100 = n % 100;
            if (m10 === 1 && m100 !== 11) return 'кабинет';
            if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'кабинета';
            return 'кабинетов';
        }

        function unitSubtitle(unit) {
            const floors = formatFloors(unit.floorList);
            if (unit.place) return countLabel(unit, unit.total);
            return floors ? `${unit.total} каб. · ${floors} эт.` : `${unit.total} каб.`;
        }

        /* ---------- Режим оптимизации ---------- */

        const OPTIMIZE_KEY = 'stgau-nav-optimized';

        function applyOptimization(isOptimized) {
            document.body.classList.toggle('optimized', isOptimized);
            document.getElementById('optimizeBtn').textContent = isOptimized ? 'Отмена' : 'Оптимизация';
        }

        function toggleOptimization() {
            const isOptimized = !document.body.classList.contains('optimized');
            playSound(isOptimized ? 'optimize-on' : 'optimize-off');
            haptic('medium');
            applyOptimization(isOptimized);
            try { localStorage.setItem(OPTIMIZE_KEY, isOptimized ? '1' : '0'); } catch (err) { /* хранилище недоступно */ }
        }

        try {
            if (localStorage.getItem(OPTIMIZE_KEY) === '1') applyOptimization(true);
        } catch (err) { /* хранилище недоступно */ }

        /* ---------- Звук ---------- */

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioContext = null;

        // Мягкий «тон»: синус, плавная атака без щелчка, срез верхов фильтром
        function softTone(ctx, { from, to, duration, volume, delay = 0 }) {
            const start = ctx.currentTime + delay;
            const osc = ctx.createOscillator();
            const filter = ctx.createBiquadFilter();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(from, start);
            osc.frequency.exponentialRampToValueAtTime(to, start + duration * 0.8);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1400, start);
            filter.Q.setValueAtTime(0.5, start);

            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.linearRampToValueAtTime(volume, start + 0.025);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + duration + 0.02);
        }

        function playSound(type) {
            const isOptimizeSound = type === 'optimize-on' || type === 'optimize-off';
            if (document.body.classList.contains('optimized') && !isOptimizeSound) return;
            if (!AudioCtx) return;
            try {
                if (!audioContext) audioContext = new AudioCtx();
                if (audioContext.state === 'suspended') audioContext.resume();

                if (type === 'optimize-on') {
                    // Мягкий спускающийся двухнотный «бульк»: режим экономии включён
                    softTone(audioContext, { from: 520, to: 440, duration: 0.16, volume: 0.07 });
                    softTone(audioContext, { from: 400, to: 330, duration: 0.22, volume: 0.06, delay: 0.09 });
                    return;
                }
                if (type === 'optimize-off') {
                    // То же, но вверх: эффекты вернулись
                    softTone(audioContext, { from: 330, to: 400, duration: 0.16, volume: 0.06 });
                    softTone(audioContext, { from: 440, to: 520, duration: 0.22, volume: 0.07, delay: 0.09 });
                    return;
                }

                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                const now = audioContext.currentTime;
                osc.connect(gain);
                gain.connect(audioContext.destination);

                if (type === 'search-open') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(650, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                }
                else if (type === 'search-close') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(550, now);
                    osc.frequency.exponentialRampToValueAtTime(280, now + 0.07);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                    osc.start(now); osc.stop(now + 0.07);
                }
                else if (type === 'corpus') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(380, now);
                    osc.frequency.exponentialRampToValueAtTime(580, now + 0.18);
                    gain.gain.setValueAtTime(0.0001, now);
                    gain.gain.linearRampToValueAtTime(0.1, now + 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
                    osc.start(now); osc.stop(now + 0.18);
                }
                else if (type === 'room') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(260, now);
                    osc.frequency.exponentialRampToValueAtTime(520, now + 0.12);
                    gain.gain.setValueAtTime(0.14, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.start(now); osc.stop(now + 0.12);
                }
            } catch (err) { /* звук — не критичен */ }
        }

        /* ---------- Сетка подразделений ---------- */

        const unitGrid = document.getElementById('unitGrid');
        unitGrid.innerHTML = UNITS.map(unit => `
            <div class="glass-card" data-tilt data-unit="${escapeHtml(unit.code)}">
                <h3>${escapeHtml(unit.code)}</h3>
                <p>${escapeHtml(unitSubtitle(unit))}</p>
            </div>
        `).join('');

        function highlightUnit(code) {
            unitGrid.querySelectorAll('.glass-card').forEach(card => {
                card.classList.toggle('is-active', card.dataset.unit === code);
            });
        }

        /* ---------- Tilt-эффект (только с мышью) ---------- */

        if (window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
            document.querySelectorAll('[data-tilt]').forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    if (document.body.classList.contains('optimized')) return;
                    const rect = card.getBoundingClientRect();
                    const xc = rect.width / 2;
                    const yc = rect.height / 2;
                    const dx = (e.clientX - rect.left - xc) / xc;
                    const dy = (e.clientY - rect.top - yc) / yc;
                    card.style.transform = `perspective(1000px) rotateX(${-dy * 8}deg) rotateY(${dx * 8}deg) translate3d(0,0,0) scale(1.02)`;
                });
                card.addEventListener('mouseleave', () => {
                    card.style.transform = '';
                });
            });
        }

        /* ---------- Кнопка «Назад» Telegram ---------- */

        function updateBackButton() {
            if (!tgSupports('6.1')) return;
            const needed = isSearchOpen || isDetailsOpen;
            try { needed ? tg.BackButton.show() : tg.BackButton.hide(); } catch (err) { /* нет поддержки */ }
        }

        function handleBack() {
            if (isSearchOpen) {
                closeFullscreenSearch();
            } else if (isDetailsOpen && currentUnit) {
                selectUnit(currentUnit);
            } else if (isDetailsOpen) {
                resetContent();
            }
        }

        if (tgSupports('6.1')) {
            try { tg.BackButton.onClick(handleBack); } catch (err) { /* нет поддержки */ }
        }

        /* ---------- Поиск ---------- */

        const searchWrapper = document.getElementById('searchWrapper');
        const searchInput = document.getElementById('searchInput');
        const searchResultsList = document.getElementById('searchResultsList');
        const searchBox = searchWrapper.querySelector('.search-box');
        const MAX_RESULTS = 60;

        let isSearchOpen = false;
        let isDetailsOpen = false;
        let currentUnit = null;

        searchInput.addEventListener('focus', () => {
            if (!isSearchOpen) {
                isSearchOpen = true;
                playSound('search-open');
                haptic('light');
                searchWrapper.classList.add('fullscreen');
                updateBackButton();
            }
            renderSearchResults(searchInput.value);
        });

        searchBox.addEventListener('click', (e) => {
            if (e.target.closest('.close-btn')) return;
            searchInput.focus();
        });

        function closeFullscreenSearch(e, silent) {
            if (e && e.stopPropagation) e.stopPropagation();
            if (!isSearchOpen) return;
            isSearchOpen = false;
            if (!silent) playSound('search-close');
            searchWrapper.classList.remove('fullscreen');
            searchInput.value = '';
            searchInput.blur();
            updateBackButton();
        }

        document.addEventListener('pointerdown', (e) => {
            if (isSearchOpen && !searchWrapper.contains(e.target)) {
                const tappedControl = e.target.closest('.glass-card, .room-card, .room-chip, .optimize-btn');
                closeFullscreenSearch(null, !!tappedControl);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isSearchOpen) closeFullscreenSearch();
        });

        searchInput.addEventListener('input', (e) => {
            renderSearchResults(e.target.value);
        });

        function roomCardHtml(room) {
            return `
                <div class="room-card" data-room="${room.id}">
                    <div class="room-info">
                        <h4>${escapeHtml(room.title)}</h4>
                        <div class="room-loc">📍 <b>${escapeHtml(room.location)}</b></div>
                        <div class="room-desc">${escapeHtml(room.unitName)}</div>
                    </div>
                </div>
            `;
        }

        function unitCardHtml(unit) {
            return `
                <div class="room-card" data-unit="${escapeHtml(unit.code)}">
                    <div class="room-info">
                        <h4>${escapeHtml(unit.code)}${unit.name ? ` <span style="font-weight: 400; color: var(--text-secondary);">· ${escapeHtml(unit.name)}</span>` : ''}</h4>
                        <div class="room-desc">${countLabel(unit, unit.total)}${unit.floorList.length ? ` · этажи ${formatFloors(unit.floorList)}` : ''}</div>
                    </div>
                </div>
            `;
        }

        const sectionLabel = (text) =>
            `<p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">${text}</p>`;

        function renderSearchResults(query) {
            const q = normalize(query.trim());

            // Пустой запрос — показываем подразделения
            if (!q) {
                searchResultsList.innerHTML = sectionLabel('Подразделения') + UNITS.map(unitCardHtml).join('');
                return;
            }

            // Все слова запроса должны встретиться: «итф 205», «нк 4 этаж»
            const tokens = q.split(/\s+/);
            const matchedUnits = UNITS.filter(u => tokens.length === 1 && normalize(u.code + ' ' + (u.name || '')).includes(q));
            const rank = (room) => {
                if (tokens.some(t => room.numberNorm === t)) return 0;          // точный номер
                if (tokens.some(t => room.numberNorm.startsWith(t))) return 1;  // номер начинается с запроса
                return 2;
            };
            const found = roomsDatabase
                .filter(room => tokens.every(t => room.haystack.includes(t)))
                .map(room => ({ room, r: rank(room) }))
                .sort((a, b) => a.r - b.r || Number(a.room.id) - Number(b.room.id))
                .map(x => x.room);

            if (!found.length && !matchedUnits.length) {
                searchResultsList.innerHTML = `<p style="text-align: center; color: var(--text-secondary); padding: 40px 0; font-size: 14px;">Ничего не найдено по запросу «<b>${escapeHtml(query.trim())}</b>»</p>`;
                return;
            }

            let html = '';
            if (matchedUnits.length) {
                html += sectionLabel('Подразделения') + matchedUnits.map(unitCardHtml).join('');
            }
            if (found.length) {
                html += sectionLabel(`Кабинеты · ${found.length}`) + found.slice(0, MAX_RESULTS).map(roomCardHtml).join('');
                if (found.length > MAX_RESULTS) {
                    html += `<p class="search-note">Показаны первые ${MAX_RESULTS}. Уточните запрос, например «ИТФ 205».</p>`;
                }
            }
            searchResultsList.innerHTML = html;
        }

        /* ---------- Контентная область ---------- */

        const contentArea = document.getElementById('contentArea');
        const contentLayout = document.getElementById('contentLayout');
        const routeContent = document.getElementById('routeContent');
        const placeholderHtml = contentArea.innerHTML;

        let swapTimer = null;
        function swapContent(html, delay) {
            clearTimeout(swapTimer);
            contentArea.style.opacity = '0';
            swapTimer = setTimeout(() => {
                contentArea.innerHTML = html;
                contentArea.style.opacity = '1';
            }, delay);
        }

        function resetContent() {
            isDetailsOpen = false;
            currentUnit = null;
            highlightUnit(null);
            contentLayout.classList.remove('active-details');
            swapContent(placeholderHtml, 200);
            updateBackButton();
        }

        function chipsHtml(rooms) {
            return `<div class="chip-row">${rooms.map(r =>
                `<div class="room-chip" data-room="${r.id}">${escapeHtml(r.number)}</div>`
            ).join('')}</div>`;
        }

        function selectRoom(id) {
            const room = roomsDatabase.find(r => r.id === id);
            if (!room) return;
            playSound('room');
            haptic('medium');
            closeFullscreenSearch(null, true);
            showDetails(room);
        }

        function selectUnit(code) {
            const unit = UNITS.find(u => u.code === code);
            if (!unit) return;
            playSound('corpus');
            haptic('light');
            closeFullscreenSearch(null, true);

            currentUnit = code;
            isDetailsOpen = false;
            highlightUnit(code);
            contentLayout.classList.remove('active-details');
            updateBackButton();

            const rooms = roomsDatabase.filter(r => r.unit === code);
            let html = `<div class="unit-title">${escapeHtml(unit.code)}</div>`;
            const subParts = [unit.name, unit.note].filter(Boolean);
            html += `<div class="unit-sub">${subParts.map(escapeHtml).join('<br>') || `${unit.total} ${roomsWord(unit.total)}`}</div>`;
            if (!unit.place) {
                const b = BUILDINGS[code];
                html += `<div class="unit-address">${addressHtml(b)}${mapButtonsHtml(b)}</div>`;
            }

            unit.floorList.forEach(floor => {
                const list = rooms.filter(r => r.floor === floor);
                html += `<div class="floor-group"><div class="floor-title">${floor} этаж</div>${chipsHtml(list)}</div>`;
            });

            (unit.noFloor || []).forEach(group => {
                const list = rooms.filter(r => !r.floor && r.sub === group.label);
                const title = unit.place
                    ? `${group.label} · ${group.building.address}`
                    : (group.label ? `${group.label} · этаж не указан` : 'Этаж не указан');
                html += `<div class="floor-group"><div class="floor-title">${escapeHtml(title)}</div>${chipsHtml(list)}</div>`;
            });

            swapContent(html, 200);
        }

        function showDetails(room) {
            currentUnit = room.unit;
            isDetailsOpen = true;
            highlightUnit(room.unit);
            contentLayout.classList.add('active-details');
            updateBackButton();

            routeContent.innerHTML = `
                <div class="route-address">${addressHtml(room.building)}</div>
                ${mapButtonsHtml(room.building)}
                <ol class="route-steps">
                    ${room.route.map(step => `<li>${escapeHtml(step)}</li>`).join('')}
                </ol>
            `;

            swapContent(`
                <div class="room-info" style="text-align: left;">
                    <h4 style="font-size: 18px; margin-bottom: 6px;">${escapeHtml(room.title)}</h4>
                    <div class="room-loc" style="font-size: 13px; margin-bottom: 4px;">📍 <b>${escapeHtml(room.location)}</b></div>
                    <div class="room-loc" style="font-size: 12px; color: #fff; margin-bottom: 10px;">${escapeHtml(room.unitName)}</div>
                    <div class="room-chip" data-unit="${escapeHtml(room.unit)}" style="display: inline-block; font-size: 12px;">${room.unitPlace ? '← Все столовые' : `← Все кабинеты ${escapeHtml(room.unit)}`}</div>
                </div>
            `, 250);

            // карточка могла оказаться выше экрана (тап по номеру внизу длинного списка)
            setTimeout(() => {
                const top = contentLayout.getBoundingClientRect().top;
                if (top < 0) contentLayout.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 300);
        }

        /* ---------- Обработка тапов (делегирование) ---------- */

        document.addEventListener('click', (e) => {
            const mapEl = e.target.closest('[data-map]');
            if (mapEl) { openMap(mapEl.dataset.map, mapEl.dataset.addr); return; }
            const roomEl = e.target.closest('[data-room]');
            if (roomEl) { selectRoom(roomEl.dataset.room); return; }
            const unitEl = e.target.closest('[data-unit]');
            if (unitEl) { selectUnit(unitEl.dataset.unit); }
        });
    </script>
</body>
</html>
