<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Навигатор СтГАУ</title>
    <!--
        ЗАПУСКАТОР (публикуется как index.html).
        Весит пару килобайт, поэтому открывается мгновенно даже на плохом интернете.
        Сам навигатор лежит в app.html: запускатор скачивает его и показывает на этой же странице.
        Если за 10 секунд навигатор не загрузился — предлагаем «Подключить зеркало»
        (с GitHub на зеркало Cloudflare и наоборот). Переход только по нажатию.
        Ссылки вида #room=… и данные Telegram при переходе сохраняются.
    -->
    <style>
        html, body { margin: 0; height: 100%; background: #090a0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Roboto, sans-serif; }
        .boot { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 24px; text-align: center; background: radial-gradient(circle at 50% 10%, #161922 0%, #090a0f 80%); }
        .boot h1 { margin: 0; font-size: 26px; font-weight: 700; }
        .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.15); border-top-color: #fff; animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .note { min-height: 40px; font-size: 13px; line-height: 1.45; color: rgba(235, 235, 245, 0.6); }
        .offer { display: none; flex-direction: column; align-items: center; gap: 10px; }
        .offer.show { display: flex; }
        .offer b { font-size: 15px; }
        .alt { padding: 12px 22px; background: #fff !important; color: #090a0f !important; border: none !important; }
        .alt, .later { padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.08); color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="boot">
        <div class="spinner"></div>
        <h1>Навигатор СтГАУ</h1>
        <div class="note" id="note">Загружаем…</div>
        <div class="offer" id="offer">
            <b id="offerTitle">Долго грузится?</b>
            <button class="alt" id="alt">Подключить зеркало</button>
            <button class="later" id="later">Подождать ещё</button>
        </div>
    </div>
    <script>
        (function () {
            var MAIN = 'https://gl0kkii.github.io/stgau-navigator/';
            var MIRROR = 'https://stgau-bot.vkyyfwr6w6.workers.dev/app/';
            var TIMEOUT = 10000;

            var onMirror = location.hostname.indexOf('workers.dev') > -1;
            var other = onMirror ? MAIN : MIRROR;
            var note = document.getElementById('note');
            var offer = document.getElementById('offer');
            var alt = document.getElementById('alt');
            var done = false;

            // На зеркале предлагаем обратное — вернуться на основной сервер
            if (onMirror) alt.textContent = 'Открыть основной сервер';

            function showOffer(title) {
                if (done) return;
                document.getElementById('offerTitle').textContent = title;
                offer.className = 'offer show';
            }

            alt.onclick = function () {
                done = true;
                note.textContent = 'Подключаем ' + (onMirror ? 'основной сервер' : 'зеркало') + '…';
                offer.className = 'offer';
                // hash несёт данные Telegram (tgWebAppData) и ссылки #room=…, поэтому переносим его целиком
                location.replace(other + location.hash);
            };
            document.getElementById('later').onclick = function () {
                offer.className = 'offer';
                note.textContent = 'Продолжаем загружать…';
                timer = setTimeout(function () { showOffer('Всё ещё грузится'); }, TIMEOUT);
            };

            var timer = setTimeout(function () { showOffer('Долго грузится?'); }, TIMEOUT);

            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'app.html', true);
            xhr.onload = function () {
                if (done) return;
                if (xhr.status !== 200 || xhr.responseText.indexOf('Навигатор СтГАУ') < 0) {
                    clearTimeout(timer);
                    note.textContent = 'Сервер ответил ошибкой.';
                    return showOffer('Не получилось загрузить');
                }
                done = true;
                clearTimeout(timer);
                // Показываем навигатор на этой же странице: адрес и hash не меняются
                document.open();
                document.write(xhr.responseText);
                document.close();
            };
            xhr.onerror = function () {
                clearTimeout(timer);
                note.textContent = 'Сервер не отвечает.';
                showOffer('Не получилось загрузить');
            };
            xhr.send();
        })();
    </script>
</body>
</html>
